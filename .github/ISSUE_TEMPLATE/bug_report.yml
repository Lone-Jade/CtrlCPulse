name: 问题反馈
description: 提示没有出现、样式异常、崩溃或行为不符合预期
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认：

        - 已经看过 [README](README.md) 与 [docs](docs/)，特别是"已知限制"；
        - 问题能在最新版本上复现；
        - 截图、日志里不含真实密码、密钥或个人信息。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 托盘右键「关于」可以看到，或查看 exe 文件属性
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - 其他（请在补充信息里说明）
    validations:
      required: true

  - type: input
    id: scale
    attributes:
      label: 显示缩放与分辨率
      placeholder: 1920x1080，125%

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开记事本，选中一段文字
        2. 按 Ctrl + C
        3. 观察屏幕右下角
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: error.log（如有）
      description: 与 exe 同目录，仅在崩溃时生成
      render: text

  - type: textarea
    id: extra
    attributes:
      label: 截图或补充信息
      description: 可以直接拖拽图片到输入框
