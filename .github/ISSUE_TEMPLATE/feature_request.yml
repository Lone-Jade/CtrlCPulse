name: 功能建议
description: 希望新增或调整某个行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意保持小而可靠（单 exe、无依赖、无联网），所以建议可能会被拒绝。请重点说明你遇到的**场景**，而不是直接给出实现方案。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      placeholder: 例如：复制大段代码时，卡片只显示前几行，看不出是不是复制到了结尾
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 例如用其它工具、改设置、改操作习惯

  - type: dropdown
    id: scope
    attributes:
      label: 这个改动大概涉及
      multiple: true
      options:
        - 剪贴板读取与类型判定
        - 卡片绘制与动画
        - 托盘菜单与设置
        - 安装与开机自启
        - 文档
        - 不确定

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
