name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译并运行自检
        shell: pwsh
        run: ./build.ps1 -Test

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CtrlCPulse
          path: dist/CtrlCPulse.exe
          if-no-files-found: error
