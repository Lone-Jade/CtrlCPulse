name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 编译并运行自检
        shell: pwsh
        run: ./build.ps1 -Test

      - name: 打包发布文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/CtrlCPulse.exe package/
          Copy-Item install.ps1, uninstall.ps1, README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "CtrlCPulse-${{ github.ref_name }}.zip"

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "CtrlCPulse-${{ github.ref_name }}.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
